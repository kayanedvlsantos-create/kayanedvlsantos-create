name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *" 
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the master branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # generates a snake game from a github user contributions graph
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3

        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23F4A6C1&color_dots=%23FDE2E4,%23FBC4D4,%23F8AFC4,%23F4A6C1,%23EC8FB5

            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F4A6C1&color_dots=%231B1B1B,%232A1A24,%234A2236,%23F4A6C1,%23FFC8DD
          
      # push the content of dist to the output branch
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
